services:
  db:
    image: pgvector/pgvector:pg17
    container_name: primeiros_socorros_db
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: primeiros_socorros
    ports:
      - "5433:5432"   # 5433 no host para não conflitar com um Postgres local
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d primeiros_socorros"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
